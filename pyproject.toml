[project]
name = "movielens-lakehouse"
version = "0.1.0"
description = "Production-style lakehouse pipeline + ALS recommender on MovieLens using Databricks + Spark."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyspark>=3.5",
  "delta-spark>=3.2",
  ]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-requests",
]
local = [
  "pyspark>=3.5",
  "delta-spark>=3.2",
]


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501"]  # keep formatting simple; ruff format handles most

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["F821", "N812"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
strict_optional = true
mypy_path = "src"
packages = ["movielens"]
exclude = ["notebooks/"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]